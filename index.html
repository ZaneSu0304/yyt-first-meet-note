<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杨云婷 · 初见小札</title>
  <style>
    :root{
      --bg1:#ffe7f0;
      --bg2:#ffd7e9;
      --card:#fff9fc;
      --line:#f1bfd2;
      --text:#4f3541;
      --muted:#7f5f6f;
      --accent:#d86b98;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      color:var(--text);
      background:linear-gradient(145deg,var(--bg1),var(--bg2));
      min-height:100vh;
    }
    .wrap{max-width:860px;margin:30px auto;padding:18px;position:relative;z-index:3}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:26px 22px;
      box-shadow:0 12px 32px #d97ba530;
    }
    h1{margin:0 0 8px;font-size:30px;color:#bf4f7f}
    .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
    .bgm{background:#fff1f7;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
    h2{margin:16px 0 10px;font-size:18px;color:#b64c79;border-bottom:1px dashed #edb0c8;padding-bottom:8px}
    .q{margin:10px 0;padding:12px;background:#fff;border:1px solid #f2c5d6;border-radius:12px}
    .q b{display:block;margin-bottom:8px}
    .opts{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:14px;color:#624657}
    label{display:flex;align-items:center;gap:6px}
    input[type="text"], textarea{
      width:100%;margin-top:8px;background:#fff;border:1px solid #efbfd1;
      color:var(--text);border-radius:10px;padding:9px 11px;font-size:14px;
    }
    textarea{min-height:72px;resize:vertical}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{
      border:none;border-radius:10px;padding:10px 14px;cursor:pointer;
      background:linear-gradient(135deg,#f39fc1,#e676a6);color:#fff;font-weight:700;
    }
    .ghost{background:#fff;border:1px solid #e7aac3;color:#b64c79}
    .foot{margin-top:14px;color:var(--muted);font-size:13px}
    .tap-unmute{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.28);z-index:99;
    }
    .tap-unmute.show{display:flex}
    .tap-card{
      background:#fff;border-radius:14px;padding:14px 16px;
      color:#4f3541;border:1px solid #f1bfd2;box-shadow:0 10px 25px rgba(0,0,0,.15);
      font-size:15px;font-weight:600;
    }
    .submiting{opacity:.75;pointer-events:none}
  </style>
</head>
<body>
  <div id="tapUnmute" class="tap-unmute">
    <div class="tap-card">轻触页面任意位置，开启背景音乐 🎵</div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>杨云婷 · 初见小札</h1>
      <p class="sub">第一次见面的小问卷（吃什么）</p>

      <div class="bgm">
        <div style="margin-bottom:8px;">🎵 BGM：高珊（已设置）</div>
        <audio id="bgm" controls preload="metadata" style="width:100%;">
          <source src="https://music.163.com/song/media/outer/url?id=30089063.mp3" type="audio/mpeg">
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
        <div style="margin-top:8px;font-size:13px;color:#7f5f6f;">进入页面后点一下播放即可（手机浏览器通常不允许自动出声）。</div>
      </div>

      <form id="foodForm" action="https://formsubmit.co/1c50a8d4084393a73cded94175beb118" method="POST">
        <input type="hidden" name="_subject" value="杨云婷·初见小札 - 问卷结果" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_next" value="https://zanesu0304.github.io/yyt-first-meet-note/thanks.html" />

        <h2>想吃啥（周全版）</h2>

        <div class="q">
          <b>1）这四类里，你现在最想吃哪一种？</b>
          <div class="opts">
            <label><input type="radio" name="最想吃" value="火锅" required>火锅</label>
            <label><input type="radio" name="最想吃" value="日料">日料</label>
            <label><input type="radio" name="最想吃" value="自助">自助</label>
            <label><input type="radio" name="最想吃" value="湖南菜">湖南菜</label>
            <label><input type="radio" name="最想吃" value="粤菜">粤菜</label>
          </div>
        </div>

        <div class="q">
          <b>2）如果吃火锅，你更偏好？</b>
          <div class="opts">
            <label><input type="checkbox" name="火锅偏好" value="清汤/菌汤">清汤/菌汤</label>
            <label><input type="checkbox" name="火锅偏好" value="牛油辣锅">牛油辣锅</label>
            <label><input type="checkbox" name="火锅偏好" value="鸳鸯锅">鸳鸯锅</label>
            <label><input type="checkbox" name="火锅偏好" value="小众特色锅底">小众特色锅底</label>
          </div>
        </div>

        <div class="q">
          <b>3）如果吃日料，你更想吃？</b>
          <div class="opts">
            <label><input type="checkbox" name="日料偏好" value="寿司刺身">寿司刺身</label>
            <label><input type="checkbox" name="日料偏好" value="烧鸟/居酒屋">烧鸟/居酒屋</label>
            <label><input type="checkbox" name="日料偏好" value="寿喜锅">寿喜锅</label>
            <label><input type="checkbox" name="日料偏好" value="鳗鱼饭/定食">鳗鱼饭/定食</label>
          </div>
        </div>

        <div class="q">
          <b>4）如果吃自助，你更重视？</b>
          <div class="opts">
            <label><input type="checkbox" name="自助关注点" value="食材品质">食材品质</label>
            <label><input type="checkbox" name="自助关注点" value="种类丰富">种类丰富</label>
            <label><input type="checkbox" name="自助关注点" value="环境安静">环境安静</label>
            <label><input type="checkbox" name="自助关注点" value="不用排队太久">不用排队太久</label>
          </div>
        </div>

        <div class="q">
          <b>5）如果吃湖南菜，辣度你能接受到？</b>
          <div class="opts">
            <label><input type="radio" name="湖南菜辣度" value="微辣">微辣</label>
            <label><input type="radio" name="湖南菜辣度" value="中辣">中辣</label>
            <label><input type="radio" name="湖南菜辣度" value="重辣">重辣</label>
            <label><input type="radio" name="湖南菜辣度" value="看当天状态">看当天状态</label>
          </div>
        </div>

        <div class="q">
          <b>6）如果选粤菜，你更想吃哪一类？</b>
          <div class="opts">
            <label><input type="radio" name="粤菜偏好" value="早茶类">早茶类</label>
            <label><input type="radio" name="粤菜偏好" value="海鲜类">海鲜类</label>
            <label><input type="radio" name="粤菜偏好" value="烧鹅/烧鸭/烧腊类">烧鹅、烧鸭、烧腊类</label>
            <label><input type="radio" name="粤菜偏好" value="都可以">都可以</label>
          </div>
        </div>

        <div class="q">
          <b>7）有没有忌口/过敏（这个最重要）</b>
          <input type="text" name="忌口与过敏" placeholder="例如：海鲜过敏、不吃香菜、少油少盐...">
        </div>

        <div class="q">
          <b>8）更方便约中饭还是晚饭？</b>
          <div class="opts">
            <label><input type="radio" name="用餐时段" value="中饭">中饭</label>
            <label><input type="radio" name="用餐时段" value="晚饭">晚饭</label>
            <label><input type="radio" name="用餐时段" value="都可以">都可以</label>
          </div>
        </div>

        <div class="q">
          <b>9）店铺环境你更偏向</b>
          <div class="opts">
            <label><input type="radio" name="环境偏好" value="安静一点">安静一点</label>
            <label><input type="radio" name="环境偏好" value="热闹一点">热闹一点</label>
            <label><input type="radio" name="环境偏好" value="都可以">都可以</label>
          </div>
        </div>

        <div class="q">
          <b>10）还有没有你特别想吃的一家店/一道菜？</b>
          <textarea name="额外想吃" placeholder="可直接写店名或菜名"></textarea>
        </div>

        <div class="btns">
          <button id="submitBtn" type="submit">提交到邮箱</button>
          <button type="button" class="ghost" onclick="sendByMailto()">提交失败？改用邮件草稿</button>
        </div>
      </form>

      <p class="foot">提交后结果会发送到：c799526989@gmail.com</p>
    </div>
  </div>
  <script>
    (function(){
      const audio = document.getElementById('bgm');
      const tap = document.getElementById('tapUnmute');
      const form = document.getElementById('foodForm');
      const submitBtn = document.getElementById('submitBtn');

      // 尝试自动播放（多数移动端会拦截）
      const tryPlay = () => audio && audio.play().catch(()=>tap.classList.add('show'));
      window.addEventListener('load', tryPlay);

      // 微信/移动端：用户任意触摸后开始播放
      const unlock = () => {
        if (!audio) return;
        audio.play().then(()=>tap.classList.remove('show')).catch(()=>{});
      };
      document.addEventListener('touchstart', unlock, { once: true, passive: true });
      document.addEventListener('click', unlock, { once: true });

      // 提交按钮状态提示
      form.addEventListener('submit', function(){
        submitBtn.textContent = '提交中...';
        submitBtn.classList.add('submiting');
      });

      window.sendByMailto = function(){
        const fd = new FormData(form);
        const lines = [];
        for (const [k,v] of fd.entries()) {
          if (String(v).trim()) lines.push(`${k}: ${v}`);
        }
        const subject = encodeURIComponent('杨云婷·初见小札 - 问卷结果');
        const body = encodeURIComponent(lines.join('\n'));
        window.location.href = `mailto:c799526989@gmail.com?subject=${subject}&body=${body}`;
      }

    })();
  </script>
</body>
</html>
