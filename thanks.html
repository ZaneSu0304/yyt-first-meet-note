<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提交成功 · 初见小札</title>
  <style>
    :root{
      --bg1:#ffe7f0;
      --bg2:#ffd7e9;
      --card:#fff9fc;
      --line:#f1bfd2;
      --text:#4f3541;
      --muted:#7f5f6f;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      color:var(--text);
      background:linear-gradient(145deg,var(--bg1),var(--bg2));
      padding:20px;
    }
    .card{
      width:min(560px,94vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:28px 24px;
      box-shadow:0 12px 32px #d97ba530;
      text-align:center;
    }
    h1{margin:0 0 10px;font-size:30px;color:#bf4f7f}
    p{margin:8px 0;color:var(--muted);line-height:1.8}
    .ok{font-size:42px;margin-bottom:6px}
    .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    a{
      text-decoration:none;
      border-radius:10px;
      padding:10px 14px;
      font-size:14px;
      font-weight:700;
    }
    .primary{background:linear-gradient(135deg,#f39fc1,#e676a6);color:#fff}
    .ghost{background:#fff;border:1px solid #e7aac3;color:#b64c79}
  </style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>已收到，感谢填写</h1>
    <p>你的问卷已提交成功。</p>
    <p>我会根据你的选择认真安排。</p>

    <div class="btns">
      <a class="primary" href="https://zanesu0304.github.io/yyt-first-meet-note/clean-v1.html">返回问卷</a>
      <a class="ghost" href="mailto:c799526989@gmail.com?subject=问卷已提交确认">邮件确认</a>
    </div>
  </div>
</body>
</html>
